version: 2.1

jobs:
  test-arm:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.medium
    steps:
      - checkout
      - run:
          name: Verify ARM pipeline
          command: |
            echo "Arch: $(uname -m)"
            uname -a
            echo "CPUs: $(nproc)"

workflows:
  test-workflow:
    jobs:
      - test-arm
