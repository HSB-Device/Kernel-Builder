version: 2.1

jobs:
  test-circleci:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Verify CircleCI pipeline
          command: |
            echo "CircleCI is working!"
            echo "Branch: $CIRCLE_BRANCH"
            echo "Commit: $CIRCLE_SHA1"
            uname -a

workflows:
  test-workflow:
    jobs:
      - test-circleci
