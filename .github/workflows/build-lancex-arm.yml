name: Build LanceX (RMX1971, ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - test-workflow

concurrency:
  group: lancex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lancex-arm:
    name: LanceX sdm670-perf + AnyKernel3 (arm64 native)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Show runner info
        run: |
          echo "Arch: $(uname -m)"
          uname -a
          echo "CPUs: $(nproc)"
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip python3 git curl ccache \
            clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          key: lancex-sdm670-arm64
          max-size: 2G

      - name: Clone LanceX kernel source
        run: |
          git clone --recursive https://github.com/HSB-Device/LanceX.git device_kernel -b 16-bpf --depth=1
          cd device_kernel
          echo "=== Kernel version ==="
          head -n 5 Makefile
          echo "=== Defconfig check ==="
          ls -l arch/arm64/configs/vendor/sdm670-perf_defconfig

      - name: Configure kernel (sdm670-perf)
        run: |
          cd device_kernel
          make O=out ARCH=arm64 \
            CC="ccache clang" LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/sdm670-perf_defconfig
          echo "=== .config head ==="
          head -n 15 out/.config

      - name: Build pure kernel
        run: |
          cd device_kernel
          set -o pipefail
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbs 2>&1 | tee build.log
          echo "=== ccache stats ==="
          ccache -s || true

      - name: Verify kernel image exists
        run: |
          cd device_kernel
          echo "=== boot dir ==="
          ls -la out/arch/arm64/boot/ || true
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "[+] Flashable image (Image.gz-dtb) found."
          else
            echo "[-] No Image.gz-dtb produced - artifact would not be flashable."
            exit 1
          fi

      - name: Pack AnyKernel3 flashable zip
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone https://github.com/HSB-Device/AnyKernel3.git anykernel3 -b LanceX --depth=1
          rm -rf anykernel3/.git

          echo "=== AK3 device config ==="
          grep -E 'kernel.string|do.devicecheck|device.name1|BLOCK=' anykernel3/anykernel.sh

          cp device_kernel/out/arch/arm64/boot/Image.gz-dtb anykernel3/

          cd anykernel3
          zip -r9 "$GITHUB_WORKSPACE/LanceX-RMX1971-sdm670-perf.zip" . -x '*.git*'

          echo "=== zip contents ==="
          unzip -l "$GITHUB_WORKSPACE/LanceX-RMX1971-sdm670-perf.zip" | grep -E 'Image.gz-dtb|anykernel.sh|update-binary' || true
          ls -la "$GITHUB_WORKSPACE/LanceX-RMX1971-sdm670-perf.zip"

      - name: Verify flashable zip
        run: |
          cd "$GITHUB_WORKSPACE"
          ZIP="LanceX-RMX1971-sdm670-perf.zip"
          if [ ! -f "$ZIP" ]; then
            echo "[-] Zip not produced."
            exit 1
          fi
          unzip -l "$ZIP" | grep -q 'Image.gz-dtb' || { echo "[-] Image.gz-dtb missing from zip."; exit 1; }
          unzip -l "$ZIP" | grep -q 'META-INF/com/google/android/update-binary' || { echo "[-] Not a recovery-flashable zip."; exit 1; }
          echo "[+] Zip is recovery-flashable and contains Image.gz-dtb."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lancex-rmx1971-sdm670
          path: |
            LanceX-RMX1971-*.zip
            device_kernel/out/arch/arm64/boot/Image*
            device_kernel/out/arch/arm64/boot/dts/qcom/*.dtb
            device_kernel/build.log
          if-no-files-found: warn
