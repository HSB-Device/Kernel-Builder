name: Build LanceX (RMX1971, ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - test-workflow

concurrency:
  group: lancex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lancex-arm:
    name: LanceX sdm670-perf + AnyKernel3 (arm64 native)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      # Distinct name so this variant can never be confused with an earlier build.
      ZIP_NAME: LanceX-RMX1971-sdm670-perf-khacfg.zip

    steps:
      - name: Show runner info
        run: |
          echo "Arch: $(uname -m)"
          uname -a
          echo "CPUs: $(nproc)"
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip python3 git curl ccache \
            clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          key: lancex-sdm670-arm64
          max-size: 2G

      - name: Clone LanceX kernel source
        run: |
          git clone --recursive https://github.com/HSB-Device/LanceX.git device_kernel -b 16-bpf --depth=1
          cd device_kernel
          echo "=== Kernel version ==="
          head -n 5 Makefile
          echo "=== Defconfig check ==="
          ls -l arch/arm64/configs/vendor/sdm670-perf_defconfig

      - name: Configure kernel (sdm670-perf)
        run: |
          cd device_kernel
          make O=out ARCH=arm64 \
            CC="ccache clang" LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/sdm670-perf_defconfig

          # --- Khaenriah-parity config (RMX1971 / RUI2) -------------------
          # The Khaenriah kernel that boots on this device differs from the
          # sdm670-perf build in exactly 46 CONFIG symbols (IKCONFIG of
          # /proc/config.gz vs IKCONFIG embedded in the built Image).
          # 16 of those are KSU/SUSFS and 1 is LOCALVERSION, leaving ~29 real
          # differences. Flip all of them in one build: a single flash then
          # answers "is the bootloop config, or (source|toolchain)".
          # Deliberately omitted: OPLUS_NFC, CPU_FREQ_GOV_SCHEDHORIZON,
          # CPU_FREQ_GOV_BLU_SCHEDUTIL - Khaenriah-only symbols that have no
          # Kconfig entry in this tree. Hidden symbols (TREE_SRCU,
          # RCU_NEED_SEGCBLIST, ARCH_HAS_SET_MEMORY) are not settable here.
          # LOCALVERSION gets a suffix so the running kernel is identifiable.
          echo "=== Apply Khaenriah-parity config ==="
          scripts/config --file out/.config \
            --set-str LOCALVERSION "-BloodMoon-khacfg" \
            -e MEMCG -e MEMCG_SWAP -e MEMCG_SWAP_ENABLED -e PAGE_COUNTER -e CGROUP_WRITEBACK \
            -e PSI -e RT_GROUP_SCHED -e PROCESS_RECLAIM \
            -e HZ_1000 -e CPU_FREQ_DEFAULT_GOV_SCHEDUTIL \
            -d HZ_100 -d CPU_FREQ_DEFAULT_GOV_PERFORMANCE \
            -d DRM_CLIENT_BOOTSPLASH -d RCU_NOCB_CPU_ALL \
            -d BPF_JIT_ALWAYS_ON -d BPF_JIT -d BPF_STREAM_PARSER -d STREAM_PARSER \
            -d NET_ACT_BPF -d NET_SOCK_MSG \
            -d CPU_BOOST -d CPU_FREQ_GOV_CONSERVATIVE -d CPU_FREQ_GOV_USERSPACE -d CPU_FREQ_GOV_ONDEMAND
          make O=out ARCH=arm64 \
            CC="ccache clang" LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          echo "=== parity check: what actually stuck ==="
          for s in MEMCG MEMCG_SWAP MEMCG_SWAP_ENABLED PAGE_COUNTER CGROUP_WRITEBACK \
                   PSI RT_GROUP_SCHED PROCESS_RECLAIM HZ HZ_1000 \
                   CPU_FREQ_DEFAULT_GOV_SCHEDUTIL CPU_FREQ_DEFAULT_GOV_PERFORMANCE \
                   DRM_CLIENT_BOOTSPLASH RCU_NOCB_CPU_ALL \
                   BPF_JIT BPF_JIT_ALWAYS_ON BPF_STREAM_PARSER STREAM_PARSER \
                   NET_ACT_BPF NET_SOCK_MSG CPU_BOOST \
                   CPU_FREQ_GOV_CONSERVATIVE CPU_FREQ_GOV_USERSPACE CPU_FREQ_GOV_ONDEMAND; do
            grep -E "^CONFIG_${s}=" out/.config || echo "CONFIG_${s} is not set"
          done
          grep -E '^CONFIG_LOCALVERSION=' out/.config

          for want in CONFIG_MEMCG=y CONFIG_PSI=y CONFIG_RT_GROUP_SCHED=y \
                      CONFIG_PROCESS_RECLAIM=y CONFIG_HZ=1000; do
            grep -q "^${want}$" out/.config || { echo "[-] ${want} did not stick."; exit 1; }
          done
          for want in CONFIG_DRM_CLIENT_BOOTSPLASH CONFIG_RCU_NOCB_CPU_ALL \
                      CONFIG_BPF_JIT_ALWAYS_ON CONFIG_STREAM_PARSER; do
            grep -q "^# ${want} is not set$" out/.config || { echo "[-] ${want} still enabled."; exit 1; }
          done

          echo "=== .config head ==="
          head -n 15 out/.config

      - name: Build pure kernel
        run: |
          cd device_kernel
          set -o pipefail
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbs 2>&1 | tee build.log
          echo "=== ccache stats ==="
          ccache -s || true

      - name: Verify kernel image exists
        run: |
          cd device_kernel
          echo "=== boot dir ==="
          ls -la out/arch/arm64/boot/ || true
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "[+] Flashable image (Image.gz-dtb) found."
          else
            echo "[-] No Image.gz-dtb produced - artifact would not be flashable."
            exit 1
          fi

      - name: Pack AnyKernel3 flashable zip
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone https://github.com/HSB-Device/AnyKernel3.git anykernel3 -b LanceX --depth=1
          rm -rf anykernel3/.git

          echo "=== AK3 device config ==="
          grep -E 'kernel.string|do.devicecheck|device.name1|BLOCK=' anykernel3/anykernel.sh

          cp device_kernel/out/arch/arm64/boot/Image.gz-dtb anykernel3/

          cd anykernel3
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '*.git*'

          echo "=== zip contents ==="
          unzip -l "$GITHUB_WORKSPACE/$ZIP_NAME" | grep -E 'Image.gz-dtb|anykernel.sh|update-binary' || true
          ls -la "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: Verify flashable zip
        run: |
          cd "$GITHUB_WORKSPACE"
          ZIP="$ZIP_NAME"
          if [ ! -f "$ZIP" ]; then
            echo "[-] Zip not produced."
            exit 1
          fi
          unzip -l "$ZIP" | grep -q 'Image.gz-dtb' || { echo "[-] Image.gz-dtb missing from zip."; exit 1; }
          unzip -l "$ZIP" | grep -q 'META-INF/com/google/android/update-binary' || { echo "[-] Not a recovery-flashable zip."; exit 1; }
          echo "[+] Zip is recovery-flashable and contains Image.gz-dtb."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lancex-rmx1971-sdm670
          path: |
            LanceX-RMX1971-*.zip
            device_kernel/out/arch/arm64/boot/Image*
            device_kernel/out/arch/arm64/boot/dts/qcom/*.dtb
            device_kernel/build.log
          if-no-files-found: warn
