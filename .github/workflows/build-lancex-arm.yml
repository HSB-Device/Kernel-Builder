name: Build LanceX (Pure Kernel ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - test-workflow

jobs:
  build-lancex-arm:
    name: LanceX sdm670-perf (arm64 native)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Show runner info
        run: |
          echo "Arch: $(uname -m)"
          uname -a
          echo "CPUs: $(nproc)"
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip python3 git curl \
            clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Clone LanceX kernel source
        run: |
          git clone --recursive https://github.com/HSB-Device/LanceX.git device_kernel -b 16-bpf --depth=1
          cd device_kernel
          echo "=== Kernel version ==="
          head -n 5 Makefile
          echo "=== Defconfig check ==="
          ls -l arch/arm64/configs/vendor/sdm670-perf_defconfig

      - name: Configure kernel (sdm670-perf)
        run: |
          cd device_kernel
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/sdm670-perf_defconfig
          echo "=== .config head ==="
          head -n 15 out/.config

      - name: Build pure kernel
        run: |
          cd device_kernel
          set -o pipefail
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

      - name: Verify kernel image exists
        run: |
          cd device_kernel
          echo "=== boot dir ==="
          ls -la out/arch/arm64/boot/ || true
          if [ -f out/arch/arm64/boot/Image ] || [ -f out/arch/arm64/boot/Image.gz ] || [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "[+] Kernel image found."
          else
            echo "[-] No kernel image produced - build did NOT really succeed."
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lancex-sdm670-arm64
          path: |
            device_kernel/out/arch/arm64/boot/Image*
            device_kernel/out/arch/arm64/boot/dts/qcom/*.dtb
            device_kernel/build.log
          if-no-files-found: warn
